name: Dashboard Demo

# Builds the dashboard in demo mode (sample data served in the browser, no
# controller or model) and publishes it to GitHub Pages under /demo/, next to
# the documentation website.

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/dashboard-demo.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/dashboard-demo.yml"
  workflow_dispatch:

permissions: read-all

concurrency:
  # Shares the website workflow's group so the two never push gh-pages at once.
  group: ${{ github.event_name == 'pull_request' && format('dashboard-demo-pr-{0}', github.event.pull_request.number) || 'gh-pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build demo
        working-directory: ui
        run: bun run build:demo

  publish:
    name: Publish dashboard demo
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build demo
        working-directory: ui
        run: bun run build:demo

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf gh-pages
          git init gh-pages
          cd gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          # Replace only the demo; the website and Helm chart repository at
          # the Pages root are published by other workflows.
          rm -rf demo
          mkdir demo
          rsync -a ../ui/dist-demo/ ./demo/
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No dashboard demo changes to publish."
            exit 0
          fi

          git commit -m "Deploy dashboard demo"
          git push origin HEAD:gh-pages
